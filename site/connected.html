<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Drive connected — SS+</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/_style.css">
<style>
  body{min-height:100vh;display:grid;place-items:center}
  .card{width:min(460px,92vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 32px 32px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple))}
  .mark svg{width:32px;height:32px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-ink);margin-bottom:8px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 auto 22px;color:var(--muted)}
  .links{margin-top:18px;font-size:13px}
  .links a{color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/></svg></div>
    <div class="badge">SS+</div>
    <h1>Google Drive connected</h1>
    <p>You can close this window and return to SS+. Your screenshots will now be uploaded to your Drive.</p>
    <button class="btn" onclick="window.close()">Close window</button>
    <div class="links"><a href="/">ssplus-app.vercel.app</a> · <a href="/privacy">Privacy policy</a></div>
  </div>
  <script>setTimeout(function(){try{window.close()}catch(e){}},2500)</script>
</body>
</html>
